<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PS5 ELF & PKG Sender</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #3b82f6;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --border: #334155;
      --success: #22c55e;
      --error: #ef4444;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px; }
    h1 { font-size: 1.5rem; text-align: center; margin-bottom: 10px; color: var(--accent); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
    .card h2 { font-size: 1.1rem; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .input-btn-group { display: flex; gap: 8px; }
    .input-btn-group input { flex: 1; }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
    label { font-size: 0.85rem; color: var(--text-dim); }
    input, select, button { padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border); background: #0f172a; color: var(--text); font-size: 0.95rem; }
    input:focus, select:focus { outline: 1px solid var(--accent); }
    button { background: var(--accent); font-weight: 600; cursor: pointer; border: none; transition: opacity 0.2s; white-space: nowrap; }
    button:hover { opacity: 0.9; }
    .btn-secondary { background: #334155; font-size: 0.8rem; padding: 6px 10px; font-weight: normal; }
    .btn-block { width: 100%; }
    
    .desc-box {
      background: #0f172a;
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 15px;
      font-size: 0.88rem;
      color: var(--text-dim);
      min-height: 42px;
      display: flex;
      align-items: center;
    }
    .desc-box.empty { color: #64748b; font-style: italic; }

    .console-box {
      background: #050914;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.85rem;
      height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .log-line { line-height: 1.4; word-break: break-all; }
    .log-time { color: #64748b; margin-right: 6px; }
    .log-info { color: var(--text-dim); }
    .log-success { color: var(--success); }
    .log-error { color: var(--error); font-weight: bold; }
    .log-warning { color: var(--warning); }
    .log-detail { color: #cbd5e1; margin-left: 15px; font-size: 0.8rem; border-left: 2px solid var(--border); padding-left: 8px; }
  </style>
</head>
<body>

<div class="container">
  <h1>PS5 ELF & PKG Sender</h1>

  <!-- Configuration IP -->
  <div class="card">
    <h2>
      Configuration PS5
      <button class="btn-secondary" onclick="setLocalIp()">127.0.0.1</button>
    </h2>
    <div class="form-group">
      <label for="ps5-ip">Adresse IP de la PS5</label>
      <input type="text" id="ps5-ip" placeholder="192.168.1.X ou 127.0.0.1" value="127.0.0.1">
    </div>
  </div>

  <!-- Section Envoi ELF -->
  <div class="card">
    <h2>Envoyer un Payload (ELF)</h2>
    
    <div class="form-group">
      <label for="elf-source-select">Source des Payloads</label>
      <select id="elf-source-select" onchange="handleElfSourceChange()">
        <option value="https://raw.githubusercontent.com/nexgen999/PS5-Super-PLDMGR-Auto-Updater/main/json/payloads.json">Dépôt Principal (nexgen999)</option>
        <option value="https://raw.githubusercontent.com/itsPLK/ps5-payloads-mirror/main/payloads.json">Miroir (itsPLK)</option>
        <option value="CUSTOM">-- Ajouter une URL personnalisée --</option>
      </select>
    </div>

    <div class="form-group" id="elf-custom-url-group" style="display: none;">
      <label for="elf-custom-url">URL personnalisée (payloads.json)</label>
      <div class="input-btn-group">
        <input type="text" id="elf-custom-url" placeholder="https://domain.com/path/payloads.json">
        <button type="button" onclick="loadElfSource(document.getElementById('elf-custom-url').value)">Charger</button>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="elf-category">1. Catégorie</label>
        <select id="elf-category" onchange="filterPayloads()">
          <option value="">Chargement...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="elf-select">2. Payload (ELF)</label>
        <select id="elf-select" onchange="updateElfDescription()">
          <option value="">Sélectionnez une catégorie</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Description</label>
      <div id="elf-description" class="desc-box empty">Aucun payload sélectionné.</div>
    </div>

    <div class="form-group">
      <label for="elf-port">Port elfldr</label>
      <input type="number" id="elf-port" value="9021">
    </div>
    <button class="btn-block" onclick="sendElf()">Injecter l'ELF</button>
  </div>

  <!-- Section Envoi PKG -->
  <div class="card">
    <h2>Installer un Package (PKG)</h2>
    
    <div class="form-group">
      <label for="pkg-source-select">Source des Packages</label>
      <select id="pkg-source-select" onchange="handlePkgSourceChange()">
        <option value="https://raw.githubusercontent.com/nexgen999/PS5-Super-PLDMGR-Auto-Updater/main/pkg.json">Dépôt Principal (nexgen999)</option>
        <option value="CUSTOM">-- Ajouter une URL personnalisée --</option>
      </select>
    </div>

    <div class="form-group" id="pkg-custom-url-group" style="display: none;">
      <label for="pkg-custom-url">URL personnalisée (pkg.json)</label>
      <div class="input-btn-group">
        <input type="text" id="pkg-custom-url" placeholder="https://domain.com/path/pkg.json">
        <button type="button" onclick="loadPkgSource(document.getElementById('pkg-custom-url').value)">Charger</button>
      </div>
    </div>

    <div class="form-group">
      <label for="pkg-select">Sélectionner un fichier PKG</label>
      <select id="pkg-select"><option value="">Chargement des packages...</option></select>
    </div>
    <div class="form-group">
      <label for="pkg-port">Port Direct PKG Installer</label>
      <input type="number" id="pkg-port" value="12800">
    </div>
    <button class="btn-block" onclick="sendPkg()">Installer le PKG</button>
  </div>

  <!-- Console de logs -->
  <div class="card">
    <h2>
      Console de statut
      <button class="btn-secondary" onclick="clearConsole()">Effacer</button>
    </h2>
    <div id="console" class="console-box"></div>
  </div>
</div>

<!-- Utilitaires et scripts d'envoi -->
<script>
  // Initialisation et utilitaires partagés
  document.getElementById('ps5-ip').value = localStorage.getItem('ps5_ip') || '127.0.0.1';
  document.getElementById('ps5-ip').addEventListener('change', (e) => {
    localStorage.setItem('ps5_ip', e.target.value.trim());
  });

  function setLocalIp() {
    document.getElementById('ps5-ip').value = '127.0.0.1';
    localStorage.setItem('ps5_ip', '127.0.0.1');
    log("IP réglée sur 127.0.0.1.", "info");
  }

  function log(msg, type = 'info', detail = null) {
    const consoleEl = document.getElementById('console');
    const time = new Date().toLocaleTimeString();

    const line = document.createElement('div');
    line.className = `log-line log-${type}`;
    
    const timeSpan = document.createElement('span');
    timeSpan.className = 'log-time';
    timeSpan.textContent = `[${time}]`;

    line.appendChild(timeSpan);
    line.appendChild(document.createTextNode(msg));
    consoleEl.appendChild(line);

    if (detail) {
      const detailEl = document.createElement('div');
      detailEl.className = 'log-detail';
      detailEl.textContent = `> ${detail}`;
      consoleEl.appendChild(detailEl);
    }

    consoleEl.scrollTop = consoleEl.scrollHeight;
  }

  function clearConsole() {
    document.getElementById('console').innerHTML = '';
    log("Console réinitialisée.", "info");
  }

  function formatRawUrl(url) {
    if (!url) return '';
    let formatted = url.trim();
    if (formatted.includes('github.com') && formatted.includes('/blob/')) {
      formatted = formatted.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
    }
    return formatted;
  }
</script>

<script src="elf.js"></script>
<script src="pkg.js"></script>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    log("Interface prête.", "info");
    handleElfSourceChange();
    handlePkgSourceChange();
  });
</script>

</body>
</html>
