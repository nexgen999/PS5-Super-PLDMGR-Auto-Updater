name: Automated PS5 Repository Build & Release

on:
  schedule:
    - cron: '0 4 * * *' # Exécution quotidienne à 04h00 UTC
  workflow_dispatch: # Permet le lancement manuel depuis GitHub

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Requis pour créer des tags et des Releases GitHub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Botbuild Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python botbuild/main.py

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chrono: mise à jour automatique des payloads et PKG [skip ci]"
          branch: main

      # Création/Mise à jour de la Release GitHub avec les ZIPs
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "PS5 Store - Latest Build"
          body_path: "whatsnew.md" # Utilise ton fichier changelog comme description
          files: |
            dist/payloads_latest.zip
            dist/pkg_latest.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}