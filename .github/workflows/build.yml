name: PS5 Super PLDMGR Auto Updater Pipeline

on:
  schedule:
    - cron: '0 */6 * * *' # Exécution toutes les 6 heures
  workflow_dispatch:      # Permet le déclenchement manuel

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Auto-Updater Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python botbuild/main.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "latest"
          name: "PS5 Payloads & PKG Auto-Update"
          body_path: whatsnew.md
          files: |
            dist/payloads_aio.zip
            dist/pkg_aio.zip
            dist/PS5_Super_PLDMGR_Store_Template.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
