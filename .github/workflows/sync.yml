name: Sync & Build AIO Package

on:
  schedule:
    - cron: '0 */6 * * *' # S'exécute toutes les 6 heures
  workflow_dispatch: # Permet de lancer le script manuellement depuis GitHub

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Set Date Tag
        id: date
        run: echo "DATE_TAG=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV

      - name: Run update_store.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python update_store.py

      - name: Build AIO Payload Package (.zip)
        run: |
          python build_aio_package.py

      - name: Build AIO PKG Package (.zip)
        run: |
          python build_aio_package_pkg.py

      - name: Commit and push updated JSONs & README
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add json/ PKGjson/ payloads/ README.md
          git commit -m "auto: update stores, payloads & readme [skip ci]" || echo "No changes to commit"
          git push

      - name: Create or Update 'latest' Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "PS5 AIO Packages (Dernière version)"
          body: |
            🚀 **Dernière mise à jour automatique des packages AIO**
            
            Cette release contient toujours les dernières versions à jour des archives :
            - **Payloads ELF/BIN AIO** (`ps5_super_pldmgr_auto_updated_offline.aio_latest.zip`)
            - **Packages PKG AIO** (`PS5PKG_aio_latest.zip`)
          draft: false
          prerelease: false
          files: |
            *.zip
            PKGjson/ps5pkg.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
