name: Auto Sync & AIO Release Pipeline

on:
  schedule:
    - cron: '0 */6 * * *' # S'exécute toutes les 6 heures
  workflow_dispatch: # Permet le déclenchement manuel

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installation du CLI GitHub
        run: type -p gh || sudo apt-get install gh -y

      - name: 1. Synchronisation des Payloads
        run: python update_store.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Packaging AIO (ZIPs & Release Notes)
        run: python build_aio_package.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 3. Génération du site Web (Twitter Dim)
        run: python generate_web.py
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

- name: 4. Publication de la Release GitHub (Horodatée & Latest)
        run: |
          if [ -f "release_notes.md" ]; then
            gh release create "v${{ env.AIO_TAG }}" \
              "${{ env.ZIP_TIMESTAMP_NAME }}" \
              "ps5_super_pldmgr_auto_updated_offline.aio_latest.zip" \
              --title "AIO Package v${{ env.AIO_TAG }}" \
              --notes-file release_notes.md \
              --latest
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 5. Commit et Push des fichiers modifiés (Pages / JSON)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add json/ payloads/ rss/ README.md index.html
          git commit -m "auto: mise à jour des payloads, du JSON et du site web [skip ci]" || exit 0
          git push
