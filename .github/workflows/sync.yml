name: Sync & Build AIO Package

on:
  schedule:
    - cron: '0 */6 * * *' # S'exécute toutes les 6 heures
  workflow_dispatch: # Permet de lancer le script manuellement depuis GitHub

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Si tu as un requirements.txt plus tard, tu pourras ajouter: pip install -r requirements.txt

      - name: Set Date Tag
        id: date
        run: echo "DATE_TAG=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV

      - name: Run update_store.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python update_store.py

      - name: Build AIO Payload Package (.zip)
        run: |
          python build_aio_package.py

      - name: Build AIO PKG Package (.zip)
        run: |
          python build_aio_package_pkg.py

      - name: Commit and push updated JSONs & README
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add json/ PKGjson/ payloads/ README.md
          git commit -m "auto: update stores, payloads & readme [skip ci]" || echo "No changes to commit"
          git push

      - name: Create Git Tag for AIO Release
        run: |
          git tag -f "aio-${{ env.DATE_TAG }}"
          git push origin "aio-${{ env.DATE_TAG }}" --force

      - name: Upload AIO Packages to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "aio-${{ env.DATE_TAG }}"
          name: "PS5 AIO Packages (${{ env.DATE_TAG }})"
          body: |
            🚀 **Mise à jour automatique des packages AIO**
            
            Ce release contient :
            - L'archive AIO regroupant tous les payloads ELF/BIN organisés par catégorie.
            - L'archive AIO regroupant tous les fichiers PKG et le manifeste JSON (`ps5pkg.json`).
            - Le fichier `ps5pkg.json` mis à jour directement téléchargeable.
          files: |
            ps5_super_pldmgr_auto_updated_offline.aio_latest.zip
            ps5_super_pldmgr_auto_updated_offline.aio_${{ env.DATE_TAG }}.zip
            PS5PKG_aio_latest.zip
            PS5PKG_aio_${{ env.DATE_TAG }}.zip
            PKGjson/ps5pkg.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
