# Copy this file to fan_control.ini on a USB root, such as:
# /mnt/usb0/fan_control.ini
#
# If no valid USB config is found, /data/fan_control.ini is checked.
# If no config file exists anywhere, target_temperature defaults to 70.
#
# target_temperature must be an Arabic integer from 30 to 90.
# If omitted or invalid, it defaults to 70 and a short notification is shown.
#
# enable controls whether the threshold is written to /dev/icc_fan:
# 0 = disabled
# 1 = enabled
# If omitted, fan threshold writes are enabled.
# If invalid, it defaults to enabled and a short notification is shown.
#
# show_status controls status notifications:
# 0 = disabled
# 1 = enabled
# If omitted, status notifications are disabled.
# If invalid, it defaults to disabled and a short notification is shown.
#
# interval controls how often the config is read, the threshold is applied,
# and status notifications are shown.
# The value must be an Arabic integer from 1 to 3600 seconds.
# If omitted, it defaults to 5 seconds.
# If invalid, it defaults to 5 seconds and a short notification is shown.
#
# This sets the system fan temperature threshold in Celsius.
# The system fan driver still controls the actual fan speed automatically.

target_temperature=70
enable=1
show_status=0
interval=5
